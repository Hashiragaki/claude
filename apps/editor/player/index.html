<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jeu Forge</title>
    <style>
      html, body {
        margin: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif;
        overflow: hidden; overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; touch-action: none; }
      #game canvas { touch-action: none; }
      #error { position: fixed; inset: auto 16px 16px; padding: 12px 16px; background: #5c1f1f; border-radius: 6px; display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="error"></div>
    <script type="module" src="../src/player/main.ts"></script>
  </body>
</html>
